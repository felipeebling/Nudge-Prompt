<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Página de teste do Ajuste Visual</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4efe6; }
  .palco { position: relative; min-height: 1600px; overflow: hidden; }
  .arte { position: absolute; width: 160px; pointer-events: none; }
  .arte-a { left: 40px; top: 60px; }
  .arte-b { right: 60px; top: 30px; rotate: 10deg; }
  .card { position: relative; z-index: 1; width: 360px; margin: 160px auto 0; padding: 24px; background: #fff; border-radius: 12px; }
  .card h2 { margin: 0 0 8px; color: #3a2a1a; font-size: 28px; }
  .botao { display: inline-block; margin-top: 12px; padding: 8px 16px; background: #c4572f; color: #fff; border-radius: 6px; }
  /* Como as gravuras do site: um bloco de fundo (camada 0) com a gravura dentro, e uma faixa (camada 1) por cima. */
  .fundo-artes { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .arte-c { left: 500px; top: 520px; }
  .faixa { position: absolute; left: 0; right: 0; top: 600px; height: 300px; background: #4a2412; z-index: 1; }
  @media (max-width: 600px) { .card { width: auto; margin: 120px 16px 0; } }
</style>
</head>
<body>
<main class="palco" data-astro-source-file="C:/site/src/pages/teste.astro" data-astro-source-loc="20:1">

  <div class="fundo-artes">
    <img class="arte arte-c" alt=""
